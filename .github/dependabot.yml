version: 2
updates:
  # Enable GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "ci"
      - "automated"

  # Swift packages of the iOS app. Dependabot reads the committed xcodeproj's
  # package references and Package.resolved (project.yml only sets `from:`
  # floors), so the generated project must stay committed for this to work.
  - package-ecosystem: "swift"
    directory: "/mobile-apps/ios"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "automated"
